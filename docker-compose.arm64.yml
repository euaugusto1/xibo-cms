# Xibo CMS Docker Compose configuration for ARM64 architecture on Coolify / VPS
#
version: "3"

services:
  db:
    image: mysql:8.4
    volumes:
      - xibo-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: cms
    # Auto-synchronize root and cms user password on existing database volume + enable mysql_native_password
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED WITH mysql_native_password BY '${MYSQL_PASSWORD}';" > /tmp/init.sql
        echo "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY '${MYSQL_PASSWORD}';" >> /tmp/init.sql
        echo "GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;" >> /tmp/init.sql
        echo "CREATE USER IF NOT EXISTS 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '${MYSQL_PASSWORD}';" >> /tmp/init.sql
        echo "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '${MYSQL_PASSWORD}';" >> /tmp/init.sql
        echo "GRANT ALL PRIVILEGES ON *.* TO 'root'@'localhost' WITH GRANT OPTION;" >> /tmp/init.sql
        echo "CREATE USER IF NOT EXISTS 'cms'@'%' IDENTIFIED WITH mysql_native_password BY '${MYSQL_PASSWORD}';" >> /tmp/init.sql
        echo "ALTER USER 'cms'@'%' IDENTIFIED WITH mysql_native_password BY '${MYSQL_PASSWORD}';" >> /tmp/init.sql
        echo "GRANT ALL PRIVILEGES ON *.* TO 'cms'@'%';" >> /tmp/init.sql
        echo "FLUSH PRIVILEGES;" >> /tmp/init.sql
        chmod 644 /tmp/init.sql
        exec docker-entrypoint.sh mysqld --mysql-native-password=ON --init-file=/tmp/init.sql --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=256M
    expose:
      - 3306
    restart: always

  xmr:
    # Build XMR natively on ARM64 directly from official repository
    build:
      context: https://github.com/xibosignage/xibo-xmr.git#develop
    ports:
      - "9505:9505"
    environment:
      XMR_DEBUG: "false"
      IPV6PUBSUPPORT: "false"
    restart: always

  web:
    # Production multi-stage build: compiles PHP vendor, Webpack, and Vite assets
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - 80
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.web.loadbalancer.server.port=80"
    environment:
      CMS_DEV_MODE: "false"
      CMS_SERVER_NAME: superxibo.augu.work
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: cms
      XMR_HOST: xmr
      CMS_USE_MEMCACHED: "false"
      CMS_QUICK_CHART_URL: http://quickchart:3400
    volumes:
      - xibo-library:/var/www/cms/library
      - xibo-custom:/var/www/cms/custom
      - xibo-backup:/var/www/backup
      - xibo-theme:/var/www/cms/web/theme/custom
      - xibo-userscripts:/var/www/cms/web/userscripts
      - xibo-cacerts:/var/www/cms/ca-certs
    restart: always

  memcached:
    image: memcached:alpine
    command: memcached -m 15
    restart: always

  quickchart:
    # Build QuickChart natively on ARM64 directly from official repository
    build:
      context: https://github.com/typpo/quickchart.git
    restart: always

volumes:
  xibo-db:
  xibo-library:
  xibo-custom:
  xibo-backup:
  xibo-theme:
  xibo-userscripts:
  xibo-cacerts:
