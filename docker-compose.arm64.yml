# Xibo CMS Docker Compose configuration for ARM64 architecture on Coolify / VPS
#
version: "3"

services:
  db:
    image: mysql:8.4
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: cms
    # Tuning for ARM instances (removed obsolete default-authentication-plugin from MySQL 8.4)
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=256M
    expose:
      - 3306
    restart: always

  xmr:
    # Build XMR natively on ARM64 directly from official repository
    build:
      context: https://github.com/xibosignage/xibo-xmr.git#develop
    ports:
      - "9505:9505"
    environment:
      XMR_DEBUG: "false"
      IPV6PUBSUPPORT: "false"
    restart: always

  web:
    # Production multi-stage build: compiles PHP vendor, Webpack, and Vite assets
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - 80
    environment:
      CMS_DEV_MODE: "false"
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: cms
      XMR_HOST: xmr
      CMS_USE_MEMCACHED: "true"
      MEMCACHED_HOST: memcached
      CMS_QUICK_CHART_URL: http://quickchart:3400
    volumes:
      - cms-library:/var/www/cms/library
      - cms-custom:/var/www/cms/custom
      - cms-backup:/var/www/backup
      - cms-web-custom:/var/www/cms/web/theme/custom
      - cms-userscripts:/var/www/cms/web/userscripts
      - cms-ca-certs:/var/www/cms/ca-certs
    restart: always

  memcached:
    image: memcached:alpine
    command: memcached -m 15
    restart: always

  quickchart:
    image: ianw/quickchart:latest
    restart: always

volumes:
  db-data:
  cms-library:
  cms-custom:
  cms-backup:
  cms-web-custom:
  cms-userscripts:
  cms-ca-certs:
